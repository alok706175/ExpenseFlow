version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: expense_tracker_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: expense_tracker_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  app:
    build: .
    container_name: expense_tracker_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysqldb
      DB_PORT: 3306
      DB_NAME: expense_tracker_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      mysqldb:
        condition: service_healthy

volumes:
  mysql_data:


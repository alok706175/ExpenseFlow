# ===================================================================
# Personal Expense Tracker - Spring Boot Configuration (Multi-Tenant)
# ===================================================================

spring.application.name=expense-tracker

# Server Port (Render.com automatically injects $PORT environment variable)
server.port=${PORT:8080}

# Default Active Profile: "h2" for local zero-dependency testing, "mysql" for production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (Production domains can be passed as comma-separated list)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Spring Boot Actuator Monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Jackson JSON Formats
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Compression & Performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===================================================================
# Personal Expense Tracker - Spring Boot Configuration
# ===================================================================

spring.application.name=expense-tracker

# Server Port (Render.com automatically injects $PORT environment variable)
server.port=${PORT:8080}

# Active Profile: "h2" for instant zero-dependency local testing,
# "mysql" for local MySQL or production (Render / Docker)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# SpringDoc OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Jackson JSON Formats
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Compression & Performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json


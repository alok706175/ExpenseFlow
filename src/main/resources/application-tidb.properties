# ===================================================================
# Profile: tidb (TiDB Cloud Serverless - Production / Cloud DB)
# ===================================================================

# TiDB is 100% MySQL-wire compatible.
# You can provide either the full DB_URL or individual host/user/password variables.
spring.datasource.url=${TIDB_URL:jdbc:mysql://${TIDB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${TIDB_PORT:4000}/${TIDB_DATABASE:test}?sslMode=VERIFY_IDENTITY&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${TIDB_USERNAME:root}
spring.datasource.password=${TIDB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings for TiDB (MySQL dialect)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool Settings optimized for TiDB Serverless
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

